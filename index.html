<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Biblioteca App!!</title>
    <script defer src="index.js"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="header">
      <h1>📚 BIBLIOTECA</h1>
      <p>Gestión de libros, usuarios y préstamos</p>
    </header>

    <div class="container">
      <nav class="sidebar">
        <ul class="sidebar-menu">
          <li><button class="btn-option" data-opcion="1">Mostrar libros</button></li>
          <li><button class="btn-option" data-opcion="2">Buscar libro</button></li>
          <li><button class="btn-option" data-opcion="3">Registrar usuario</button></li>
          <li><button class="btn-option" data-opcion="4">Prestar libro</button></li>
          <li><button class="btn-option" data-opcion="5">Devolver libro</button></li>
          <li><button class="btn-option" data-opcion="6">Mostrar libros disponibles</button></li>
          <li><button class="btn-option" data-opcion="7">Mostrar libros prestados</button></li>
          <li><button class="btn-option" data-opcion="8">Estadísticas</button></li>
          <li><button class="btn-option" data-opcion="9">Salir</button></li>
        </ul>
      </nav>

      <main class="content"></main>
    </div>
  </body>
</html>
